name: NetworkDoctor Android Validation
# Manual build-only checks for any NetworkDoctor branch; never uploads to Google Play.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: NetworkDoctor branch to validate
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: networkdoctor-validation
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout NetworkDoctor source
        uses: actions/checkout@v4
        with:
          repository: Persie0/NetworkDoctor
          ref: ${{ inputs.branch || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}

      - name: Record source revision
        run: |
          echo "Source SHA: $(git rev-parse HEAD)"
          echo "## NetworkDoctor source" >> "$GITHUB_STEP_SUMMARY"
          echo "`$(git rev-parse HEAD)`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        env:
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s app/key.jks
          test -n "$STORE_PASS"
          test -n "$KEY_PASS"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("key.properties")
          s = path.read_text()
          s = s.replace("#{KEYSTORE_PASS}#", os.environ["STORE_PASS"])
          s = s.replace("#{KEYSTORE_KEY_PASS}#", os.environ["KEY_PASS"])
          path.write_text(s)
          PY

      - name: Verify unit tests, lint and signed release
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Upload validation artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetworkDoctor-validation
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.html
          if-no-files-found: warn
          retention-days: 3
