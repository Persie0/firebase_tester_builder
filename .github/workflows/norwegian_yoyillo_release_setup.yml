name: Norwegian YoYillo release setup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/norwegian_yoyillo_release_setup.yml'

permissions:
  contents: write

jobs:
  stage-release-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release builder
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Add Norwegian YoYillo to staged release selectors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = 'norwegian_yoyillo'
          entry = f'          - {app}\n'
          sources = [
              Path('.github/workflows/play_auto.yml'),
              Path('.github/workflows/app_store_auto.yml'),
          ]
          stage_dir = Path('staged_release_workflows/norwegian_yoyillo')
          stage_dir.mkdir(parents=True, exist_ok=True)

          for source in sources:
              text = source.read_text(encoding='utf-8')
              if entry not in text:
                  anchor = '        default: noise_remover\n'
                  if text.count(anchor) != 1:
                      raise SystemExit(
                          f'{source}: expected exactly one app-selector default anchor, '
                          f'found {text.count(anchor)}'
                      )
                  text = text.replace(anchor, entry + anchor, 1)

              if text.count(entry) != 1:
                  raise SystemExit(
                      f'{source}: expected norwegian_yoyillo exactly once after edit, '
                      f'got {text.count(entry)}'
                  )

              target = stage_dir / source.name
              target.write_text(text, encoding='utf-8')
              print(f'Staged {target}')
          PY

      - name: Verify staged workflow files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          entry = '          - norwegian_yoyillo\n'
          for path in [
              Path('staged_release_workflows/norwegian_yoyillo/play_auto.yml'),
              Path('staged_release_workflows/norwegian_yoyillo/app_store_auto.yml'),
          ]:
              text = path.read_text(encoding='utf-8')
              count = text.count(entry)
              if count != 1:
                  raise SystemExit(f'{path}: expected norwegian_yoyillo exactly once, got {count}')
              print(f'{path}: norwegian_yoyillo present exactly once')
          PY
          git diff --check -- staged_release_workflows/norwegian_yoyillo

      - name: Commit staged workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add staged_release_workflows/norwegian_yoyillo
          if git diff --cached --quiet; then
            echo 'Staged workflow copies already current.'
          else
            git commit -m 'ci: stage Norwegian YoYillo release workflows'
            git push origin HEAD:main
          fi
