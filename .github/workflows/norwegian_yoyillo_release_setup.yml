name: Dispatch Norwegian YoYillo release once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/norwegian_yoyillo_release_setup.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Norwegian YoYillo through Play pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run play_auto.yml \
            --repo Persie0/firebase_tester_builder \
            --ref main \
            -f app=norwegian_yoyillo \
            -f build_apk=false \
            -f run_tests=false \
            -f branch=main
          echo 'Dispatched play_auto.yml for norwegian_yoyillo@main.'
