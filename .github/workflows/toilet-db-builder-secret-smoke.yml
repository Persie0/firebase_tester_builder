name: ToiletCompass builder secret smoke
on:
  push:
    branches: [feat/toilet-db-key-injection]
    paths: ['.github/workflows/toilet-db-builder-secret-smoke.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify configured app encryption key without logging it
        env:
          TOILET_DB_KEY_B64: ${{ secrets.TOILET_DB_KEY_B64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          raw = os.environ.get('TOILET_DB_KEY_B64', '')
          try:
              key = base64.b64decode(raw, validate=True)
          except Exception:
              raise SystemExit('App build encryption key missing or invalid base64') from None
          if len(key) != 32:
              raise SystemExit('App build encryption key missing or not 256-bit')
          print('App build encryption key configuration: valid 256-bit key')
          PY
