name: Dispatch Pareader tester release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/dispatch_pareader_release.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pareader tester build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "play_auto.yml" \
            --repo "$GITHUB_REPOSITORY" \
            -f app="pareader" \
            -f build_apk=false \
            -f run_tests=true \
            -f branch="master"
