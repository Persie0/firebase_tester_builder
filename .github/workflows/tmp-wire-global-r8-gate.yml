name: Temporary wire global R8 gate

on:
  push:
    branches:
      - feat/global-r8-25-gate
    paths:
      - '.github/workflows/tmp-wire-global-r8-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-r8-25-gate
      - name: Patch Play release workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/play_auto.yml')
          text = path.read_text()

          anchor = """      - name: Checkout EULA repository\n"""
          policy_checkout = """      - name: Checkout release policy\n        uses: actions/checkout@v4\n        with:\n          repository: 'Persie0/firebase_tester_builder'\n          ref: ${{ github.sha }}\n          path: .firebase_builder\n          sparse-checkout: |\n            .github/scripts/verify_r8_min_scores.py\n          sparse-checkout-cone-mode: false\n\n"""
          if policy_checkout not in text:
              if anchor not in text:
                  raise SystemExit('checkout insertion anchor not found')
              text = text.replace(anchor, policy_checkout + anchor, 1)

          old = """      - name: Verify R8 release metrics\n        shell: bash\n        run: |\n          set -euo pipefail\n          if [ -f .github/scripts/verify_r8_metrics.py ]; then\n            python3 .github/scripts/verify_r8_metrics.py\n          else\n            echo 'No app-specific R8 verifier found; skipping.'\n          fi\n"""
          new = """      - name: Enforce global R8 25% gate\n        shell: bash\n        run: |\n          set -euo pipefail\n          python3 .firebase_builder/.github/scripts/verify_r8_min_scores.py \\\n            build/app/outputs/bundle/release/app-release.aab\n\n      - name: Run app-specific R8 verifier\n        shell: bash\n        run: |\n          set -euo pipefail\n          if [ -f .github/scripts/verify_r8_metrics.py ]; then\n            python3 .github/scripts/verify_r8_metrics.py\n          else\n            echo 'No app-specific R8 verifier found; global 25% gate already passed.'\n          fi\n"""
          if old not in text:
              raise SystemExit('R8 verification replacement block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Commit workflow wiring and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-wire-global-r8-gate.yml
          git add .github/workflows/play_auto.yml
          git commit -m 'feat: enforce R8 25 percent gate before Play upload'
          git push origin HEAD:feat/global-r8-25-gate
