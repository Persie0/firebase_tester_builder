name: Live Noise Cancelling R8 diagnostics

on:
  push:
    paths:
      - .github/workflows/live_noise_cancelling_r8_diagnostics.yml

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          repository: Persie0/live_noise_cancelling
          ref: fix/r8-sentry-proguard-20261001
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21.x'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure signing
        shell: bash
        env:
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PROPERTIES_FILE="$(find . -name key.properties | grep 'android/' | head -n 1 || true)"
          if [ -n "$PROPERTIES_FILE" ] && [ -f "$PROPERTIES_FILE" ]; then
            sed -i "s/#{KEYSTORE_PASS}#/${STORE_PASS}/g" "$PROPERTIES_FILE"
            sed -i "s/#{KEYSTORE_KEY_PASS}#/${KEY_PASS}/g" "$PROPERTIES_FILE"
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="$(grep -r 'ndkVersion' android/ --include='*.gradle' --include='*.gradle.kts' 2>/dev/null | grep -oP '"\K[^"]+' | head -n 1 || true)"
          if [ -z "$NDK_VERSION" ]; then NDK_VERSION=28.2.13676358; fi
          echo y | sdkmanager "ndk;${NDK_VERSION}" --sdk_root="$ANDROID_SDK_ROOT"

      - name: Configure Gradle for R8 analysis
        shell: bash
        run: |
          set -euo pipefail
          touch android/gradle.properties
          sed -i '/org.gradle.jvmargs=/d;/kotlin.daemon/d;/kotlin.compiler/d;/android.r8/d;/org.gradle.workers/d;/org.gradle.daemon=/d;/org.gradle.vfs.watch=/d;/android.experimental.r8.enableR8ConfigurationAnalyzer=/d' android/gradle.properties
          {
            echo 'org.gradle.jvmargs=-Xms6g -Xmx13g -XX:+UseParallelGC -XX:ParallelGCThreads=2'
            echo 'org.gradle.daemon=false'
            echo 'org.gradle.vfs.watch=false'
            echo 'org.gradle.workers.max=1'
            echo 'kotlin.compiler.execution.strategy=in-process'
            echo 'android.r8.jvmargs=-Xmx6g -XX:+UseParallelGC'
            echo 'android.experimental.r8.enableR8ConfigurationAnalyzer=true'
          } >> android/gradle.properties

      - run: flutter pub get

      - name: Show resolved Sentry versions
        run: flutter pub deps | grep -E 'sentry(_flutter|_dart_plugin)? ' || true

      - name: Build release bundle and analyzer report
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xms6g -Xmx13g -XX:+UseParallelGC' -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dandroid.r8.jvmargs='-Xmx6g'"
        run: |
          flutter build appbundle \
            --obfuscate \
            --split-debug-info=./build \
            --build-name=20261001-r8diag \
            --build-number=26

      - name: Collect R8 diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r8-diagnostics
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          aab = Path('build/app/outputs/bundle/release/app-release.aab')
          out = Path('r8-diagnostics/r8.json')
          with zipfile.ZipFile(aab) as z:
              out.write_bytes(z.read('BUNDLE-METADATA/com.android.tools/r8.json'))
          data = json.loads(out.read_text())
          stats = data['stats']
          print(f"Optimization: {100-float(stats['noOptimizationPercentage']):.2f}%")
          print(f"Obfuscation: {100-float(stats['noObfuscationPercentage']):.2f}%")
          print(f"Shrinking: {100-float(stats['noShrinkingPercentage']):.2f}%")
          print(json.dumps(data, indent=2))
          PY
          fi
          if [ -d build/app/outputs/mapping/release ]; then
            cp -a build/app/outputs/mapping/release/. r8-diagnostics/
          fi
          find build -name 'configanalyzer.html' -type f -print -exec cp {} r8-diagnostics/configanalyzer.html \; 2>/dev/null || true
          echo 'Diagnostic files:'
          find r8-diagnostics -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload R8 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-noise-cancelling-r8-diagnostics-sentry
          path: r8-diagnostics
          if-no-files-found: warn
          retention-days: 3
