name: HanziHero fix release trigger

on:
  push:
    paths:
      - .github/workflows/hanzihero_fix_release_trigger.yml

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch HanziHero fix branch through Play pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run play_auto.yml             --repo Persie0/firebase_tester_builder             --ref main             -f app=hanzi_hero             -f build_apk=true             -f run_tests=true             -f branch=fix/gdrive-sync-tests-native-boundary
