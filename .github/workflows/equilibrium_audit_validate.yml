name: Equilibrium audit validation

on:
  push:
    branches:
      - equilibrium-audit-validation

permissions:
  contents: read

concurrency:
  group: equilibrium-audit-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Equilibrium audit branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/equilibrium
          ref: audit/ui-ux-2026-08-26
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21.x'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
