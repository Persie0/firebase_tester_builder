name: Validate approved Norwegian and R8 PRs

on:
  push:
    paths:
      - .github/workflows/validate_approved_prs_20260921.yml

permissions:
  contents: read

jobs:
  norwegian:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/norwegian_yoyillo
          ref: chore/deps-google-services-20260921
          token: ${{ secrets.GH_TOKEN }}
          path: app
      - name: Configure private Git dependencies
        env:
          REPO_TOKEN: ${{ secrets.GH_TOKEN }}
        run: git config --global url."https://x-access-token:${REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze --no-fatal-infos
      - working-directory: app
        run: flutter build apk --debug

  figura-r8:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/mwst_buchhalter
          ref: chore/r8-modernization-current-20260921
          token: ${{ secrets.GH_TOKEN }}
          path: app
      - name: Configure private Git dependencies
        env:
          REPO_TOKEN: ${{ secrets.GH_TOKEN }}
        run: git config --global url."https://x-access-token:${REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare signing
        working-directory: app
        run: |
          sed -i 's/#{KEYSTORE_PASS}#/${{ secrets.STORE_PASSWORD }}/g' android/key.properties
          sed -i 's/#{KEYSTORE_KEY_PASS}#/${{ secrets.KEY_PASSWORD }}/g' android/key.properties
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "ndk;29.0.13599879" >/dev/null 2>&1 || true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze --no-fatal-infos
      - working-directory: app
        run: flutter test
      - working-directory: app
        run: flutter build appbundle --obfuscate --split-debug-info=./build
      - name: Analyze R8 configuration
        working-directory: app/android
        run: ./gradlew --no-daemon :app:analyzeReleaseR8Config
      - name: Verify R8 metrics
        working-directory: app
        run: python3 .github/scripts/verify_r8_metrics.py

  vitamind-r8:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/vitamindtracker
          ref: chore/r8-modernization-current-20260921
          token: ${{ secrets.GH_TOKEN }}
          path: app
      - name: Configure private Git dependencies
        env:
          REPO_TOKEN: ${{ secrets.GH_TOKEN }}
        run: git config --global url."https://x-access-token:${REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare signing
        working-directory: app
        run: |
          sed -i 's/#{KEYSTORE_PASS}#/${{ secrets.STORE_PASSWORD }}/g' android/key.properties
          sed -i 's/#{KEYSTORE_KEY_PASS}#/${{ secrets.KEY_PASSWORD }}/g' android/key.properties
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "ndk;29.0.13599879" >/dev/null 2>&1 || true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze --no-fatal-infos
      - working-directory: app
        run: flutter test
      - working-directory: app
        run: flutter build appbundle --obfuscate --split-debug-info=./build
      - name: Analyze R8 configuration
        working-directory: app/android
        run: ./gradlew --no-daemon :app:analyzeReleaseR8Config
      - name: Verify R8 metrics
        working-directory: app
        run: python3 .github/scripts/verify_r8_metrics.py
