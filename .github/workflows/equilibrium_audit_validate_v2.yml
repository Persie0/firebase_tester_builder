name: Equilibrium final audit validation

on:
  push:
    branches:
      - equilibrium-audit-validation

permissions:
  contents: read

concurrency:
  group: equilibrium-final-audit-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Equilibrium audit branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/equilibrium
          ref: audit/ui-ux-2026-08-26
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21.x'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Capture resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: equilibrium-resolved-lockfile
          path: pubspec.lock
          retention-days: 1

      - name: Check patch whitespace
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Commit resolved lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock already matches the resolved dependency graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "refresh Flutter dependency lockfile"
          git push origin HEAD:audit/ui-ux-2026-08-26
