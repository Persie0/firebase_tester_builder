name: Play Store Automation
run-name: Deploy ${{ inputs.app }}${{ inputs.branch != '' && format(' ({0})', inputs.branch) || '' }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Choose which app to build and deploy'
        required: true
        type: choice
        options:
          - noise_remover
          - vitamindtracker
          - image_enhancer
          - face_scanner
          - resistor_scanner
          - root_detection_app
          - surebets_calculator
          - resistor-calc
          - fake_gps_detector
          - hanzi_hero
          - Memory_Palace_Builder
          - recorder_noise_remove
          - skratch_clone
          - toiletcompass
          - equilibrium
          - image_compressor
          - QR-Code-Scanner
          - live_noise_cancelling
          - pareader
          - secret_audio_message
          - screendetector
        default: noise_remover
      build_apk:
        description: 'Build Universal APK (Telegram upload disabled)'
        required: false
        type: boolean
        default: false
      run_tests:
        description: 'Run Robo tests on Firebase Test Lab'
        required: false
        type: boolean
        default: false
      branch:
        description: 'Branch to checkout (leave empty for default)'
        required: false
        default: ''

concurrency:
  group: android-release-${{ inputs.app }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'Persie0/${{ inputs.app }}'
          token: ${{ secrets.GH_TOKEN }}
          ref: ${{ inputs.branch }}

      - name: Checkout EULA repository
        uses: actions/checkout@v4
        with:
          repository: 'Persie0/Persie0.github.io'
          token: ${{ secrets.GH_TOKEN }}
          path: eula_repo

      - name: Update EULA and static assets
        run: |
          mkdir -p assets/eula/translations_eula assets/eula/static
          cp -rf eula_repo/translations_eula/. assets/eula/translations_eula/
          cp -rf eula_repo/static/. assets/eula/static/
          rm -rf eula_repo

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21.x'

      - name: Set keystore secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.app }}" == "noise_remover" || "${{ inputs.app }}" == "recorder_noise_remove" ]]; then
            echo "STORE_PASS=${{ secrets.NOISE_REMOVER_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${{ secrets.NOISE_REMOVER_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          elif [[ "${{ inputs.app }}" == "resistor_scanner" ]]; then
            echo "STORE_PASS=${{ secrets.RESISTOR_SCANNER_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${{ secrets.RESISTOR_SCANNER_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "STORE_PASS=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Configure keystore
        shell: bash
        run: |
          set -euo pipefail
          PROPERTIES_FILE="$(find . -name key.properties | grep 'android/' | head -n 1 || true)"
          if [ -z "$PROPERTIES_FILE" ]; then
            PROPERTIES_FILE="$(find . -name key.properties | head -n 1 || true)"
          fi

          if [ -n "$PROPERTIES_FILE" ] && [ -f "$PROPERTIES_FILE" ]; then
            sed -i "s/#{KEYSTORE_PASS}#/${STORE_PASS}/g" "$PROPERTIES_FILE"
            sed -i "s/#{KEYSTORE_KEY_PASS}#/${KEY_PASS}/g" "$PROPERTIES_FILE"
            KEY_ALIAS="$(grep '^keyAlias=' "$PROPERTIES_FILE" | cut -d= -f2- | xargs | tr -d '\r' || true)"
          else
            KEY_ALIAS=""
          fi

          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS=key
          fi
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

          KEYSTORE_PATH="$(find . \( -name '*.jks' -o -name '*.keystore' \) | grep 'android/' | head -n 1 | sed 's|^\./||' || true)"
          if [ -z "$KEYSTORE_PATH" ]; then
            KEYSTORE_PATH=android/app/key.jks
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get package name
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find android/app -type f \( -name build.gradle -o -name build.gradle.kts \) 2>/dev/null | head -n 1 || true)"
          if [ -z "$FILE" ]; then
            echo "::error::android/app build.gradle(.kts) not found"
            exit 1
          fi

          PACKAGE_NAME="$(grep -oP 'applicationId\s*=?\s*["'\'']\K[^"'\'']+' "$FILE" | head -n 1 || true)"
          if [ -z "$PACKAGE_NAME" ]; then
            PACKAGE_NAME="$(grep -oP 'namespace\s*=?\s*["'\'']\K[^"'\'']+' "$FILE" | head -n 1 || true)"
          fi
          if [ -z "$PACKAGE_NAME" ] || [[ "$PACKAGE_NAME" == *'${'* ]]; then
            echo "::error::Could not determine package name from $FILE"
            exit 1
          fi
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "Package: $PACKAGE_NAME"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Pre-install NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="$(grep -r 'ndkVersion' android/ --include='*.gradle' --include='*.gradle.kts' 2>/dev/null | grep -oP '"\K[^"]+' | head -n 1 || true)"
          if [ -z "$NDK_VERSION" ]; then
            NDK_VERSION=29.0.14206865
          fi
          echo y | sdkmanager "ndk;${NDK_VERSION}" --sdk_root="$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: false
          remove_dotnet: false
          remove_haskell: true
          remove_tool_cache: false
          remove_swap: false
          remove_packages_one_command: true
          remove_folders: /usr/share/swift
          testing: false

      - name: Configure Gradle memory
        shell: bash
        run: |
          set -euo pipefail
          touch android/gradle.properties
          sed -i '/org.gradle.jvmargs=/d;/kotlin.daemon/d;/kotlin.compiler/d;/android.r8/d;/org.gradle.workers/d;/org.gradle.daemon=/d;/org.gradle.vfs.watch=/d' android/gradle.properties
          {
            echo 'org.gradle.jvmargs=-Xms6g -Xmx13g -XX:+UseParallelGC -XX:ParallelGCThreads=2'
            echo 'org.gradle.daemon=false'
            echo 'org.gradle.vfs.watch=false'
            echo 'org.gradle.workers.max=1'
            echo 'kotlin.compiler.execution.strategy=in-process'
            echo 'android.r8.jvmargs=-Xmx6g -XX:+UseParallelGC'
          } >> android/gradle.properties

      - run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Install Play API helper
        run: python -m pip install --quiet google-auth requests

      - name: Resolve next Play versionCode
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_NAME=$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          package_name = os.environ['PACKAGE_NAME']
          service_account_json = os.environ.get('SERVICE_ACCOUNT_JSON', '')
          if not service_account_json:
              raise SystemExit('SERVICE_ACCOUNT_JSON is missing')

          info = json.loads(service_account_json)
          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=['https://www.googleapis.com/auth/androidpublisher'],
          )
          credentials.refresh(Request())

          base = (
              'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/'
              + urllib.parse.quote(package_name, safe='')
          )
          headers = {
              'Authorization': f'Bearer {credentials.token}',
              'Content-Type': 'application/json',
          }

          def request_json(method, url, body=None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read().decode('utf-8')
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  details = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'Google Play API {method} {url} failed: {exc.code} {details}') from exc

          edit = request_json('POST', f'{base}/edits', {})
          edit_id = edit['id']
          artifact_codes = []
          track_codes = []
          try:
              bundles = request_json('GET', f'{base}/edits/{edit_id}/bundles')
              apks = request_json('GET', f'{base}/edits/{edit_id}/apks')
              tracks = request_json('GET', f'{base}/edits/{edit_id}/tracks')

              artifact_codes.extend(int(item['versionCode']) for item in bundles.get('bundles', []))
              artifact_codes.extend(int(item['versionCode']) for item in apks.get('apks', []))

              for track in tracks.get('tracks', []):
                  for release in track.get('releases', []):
                      track_codes.extend(int(code) for code in release.get('versionCodes', []))
          finally:
              try:
                  request_json('DELETE', f'{base}/edits/{edit_id}')
              except Exception as exc:
                  print(f'Warning: could not delete probe edit {edit_id}: {exc}')

          local_build = 0
          try:
              with open('pubspec.yaml', encoding='utf-8') as handle:
                  for line in handle:
                      match = re.match(r'^\s*version:\s*[^+\s]+\+(\d+)\s*$', line)
                      if match:
                          local_build = int(match.group(1))
                          break
          except FileNotFoundError:
              pass

          all_codes = artifact_codes + track_codes + [local_build, 0]
          highest = max(all_codes)
          next_code = highest + 1
          if next_code > 2_100_000_000:
              raise SystemExit(f'Next versionCode {next_code} exceeds Google Play limit')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'BUILD_NUMBER={next_code}\n')

          print(f'Play artifact versionCodes: {sorted(set(artifact_codes))[-10:]}')
          print(f'Play track versionCodes: {sorted(set(track_codes))[-10:]}')
          print(f'Local pubspec build number: {local_build}')
          print(f'Next Android versionCode: {next_code}')
          PY

      - name: Build app bundle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xms6g -Xmx13g -XX:+UseParallelGC' -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dandroid.r8.jvmargs='-Xmx6g'"
        run: |
          flutter build appbundle \
            --obfuscate \
            --split-debug-info=./build \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Sentry upload
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if grep -q sentry_dart_plugin pubspec.yaml; then
            flutter packages pub run sentry_dart_plugin
          fi

      - name: Download bundletool
        if: inputs.build_apk || inputs.run_tests
        run: wget -q https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar

      - name: Extract universal APK
        if: inputs.build_apk || inputs.run_tests
        shell: bash
        run: |
          set -euo pipefail
          java -jar bundletool.jar build-apks \
            --overwrite \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=app.apks \
            --mode=universal \
            --ks="$KEYSTORE_PATH" \
            --ks-pass="pass:$STORE_PASS" \
            --ks-key-alias="$KEY_ALIAS" \
            --key-pass="pass:$KEY_PASS"
          unzip -oq app.apks -d extracted_apk
          mv extracted_apk/universal.apk app-release.apk

      # Telegram upload disabled.
      # - name: Checkout Telegram uploader
      #   if: inputs.build_apk
      #   uses: actions/checkout@v4
      #   with:
      #     repository: Persie0/github_torrent_downloader
      #     token: ${{ secrets.GH_TOKEN }}
      #     path: telegram_tools

      # - name: Set up Python for Telegram
      #   if: inputs.build_apk
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.10'

      # - name: Send Universal APK to Telegram
      #   if: inputs.build_apk
      #   run: |
      #     python -m pip install --quiet telethon cryptg
      #     python telegram_tools/telegram_uploader.py \
      #       --api-id "${{ secrets.TELEGRAM_API_ID }}" \
      #       --api-hash "${{ secrets.TELEGRAM_API_HASH }}" \
      #       --bot-token "${{ secrets.TELEGRAM_BOT_TOKEN }}" \
      #       --chat-id "${{ secrets.TELEGRAM_CHAT_ID }}" \
      #       --file app-release.apk \
      #       --message "${{ inputs.app }} $BUILD_NAME ($BUILD_NUMBER) universal APK from GitHub Actions run #${{ github.run_number }}"

      - name: Upload Android release to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal

      - name: Authenticate to Google Cloud
        if: inputs.run_tests
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        if: inputs.run_tests
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Test Lab
        if: inputs.run_tests
        run: |
          gcloud firebase test android run \
            --app=app-release.apk \
            --type=robo \
            --device=model=MediumPhone.arm,version=34 \
            --timeout=180s \
            --no-auto-google-login

      - name: Stop Gradle daemons
        if: always()
        run: |
          cd android && ./gradlew --stop || true
          pkill -f GradleDaemon || true
