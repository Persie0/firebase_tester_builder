name: Validate approved R8 ports

on:
  push:
    paths:
      - .github/workflows/validate_approved_r8_ports.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: figura
            repo: Persie0/mwst_buchhalter
            ref: chore/r8-modernization-current-20260921
          - name: vitamind
            repo: Persie0/vitamindtracker
            ref: chore/r8-modernization-current-20260921

    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: app

      - name: Configure private Git dependencies
        env:
          REPO_TOKEN: ${{ secrets.GH_TOKEN }}
        run: git config --global url."https://x-access-token:${REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure signing
        working-directory: app
        env:
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -f android/key.properties ]; then
            sed -i "s/#{KEYSTORE_PASS}#/${STORE_PASS}/g" android/key.properties
            sed -i "s/#{KEYSTORE_KEY_PASS}#/${KEY_PASS}/g" android/key.properties
          fi

      - name: Prepare Android SDK
        working-directory: app
        run: |
          set -euo pipefail
          NDK_VERSION="$(grep -r 'ndkVersion' android/ --include='*.gradle' --include='*.gradle.kts' 2>/dev/null | grep -oP '"\K[^"]+' | head -n 1 || true)"
          if [ -z "$NDK_VERSION" ]; then NDK_VERSION=29.0.14206865; fi
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "ndk;${NDK_VERSION}" >/dev/null 2>&1 || true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Tests
        working-directory: app
        run: |
          if [ -d test ]; then flutter test; else echo "No tests"; fi

      - name: Build release AAB
        working-directory: app
        run: flutter build appbundle --release --obfuscate --split-debug-info=./build

      - name: Analyze R8 config
        working-directory: app/android
        run: ./gradlew --no-daemon :app:analyzeReleaseR8Config

      - name: Verify R8 metrics
        working-directory: app
        run: python3 .github/scripts/verify_r8_metrics.py
