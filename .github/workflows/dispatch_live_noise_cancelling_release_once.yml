name: Dispatch live_noise_cancelling release once

on:
  push:
    paths:
      - '.github/workflows/dispatch_live_noise_cancelling_release_once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-and-watch:
    if: github.event.head_commit.message == 'Dispatch live noise cancelling release once'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Dispatch shared release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh workflow run play_auto.yml \
            --repo Persie0/firebase_tester_builder \
            --ref main \
            -f app=live_noise_cancelling \
            -f build_apk=false \
            -f run_tests=false \
            -f branch=master

          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID="$(gh run list \
              --repo Persie0/firebase_tester_builder \
              --workflow play_auto.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,createdAt,displayTitle \
              --jq ".[] | select(.createdAt >= \"${STARTED_AT}\" and (.displayTitle | contains(\"Deploy live_noise_cancelling (master)\"))) | .databaseId" \
              | head -n 1)"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Dispatched live_noise_cancelling release workflow was not found."
            exit 1
          fi

          echo "Release workflow run: $RUN_ID"
          gh run watch "$RUN_ID" \
            --repo Persie0/firebase_tester_builder \
            --exit-status
