name: Dispatch fixed Uniminder Play build (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-uniminder-play-20261021.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start corrected Play workflow for Uniminder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run play_auto.yml \
            --repo Persie0/firebase_tester_builder \
            --ref main \
            -f app=uniminder \
            -f branch=master \
            -f play_track=internal \
            -f build_apk=false \
            -f run_tests=false
          echo 'Dispatched a new Uniminder internal-track release using the fixed main workflow.'
