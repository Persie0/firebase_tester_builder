name: HanziHero APK one-shot

on:
  push:
    paths:
      - .github/workflows/hanzihero_apk_once.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout HanziHero main
        uses: actions/checkout@v5
        with:
          repository: Persie0/hanzi_hero
          ref: main
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.GH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install NDK
        run: sdkmanager "ndk;29.0.14206865" >/dev/null

      - name: Build debug APK
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Publish debug APK release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short=8 HEAD)"
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          cp "$APK" "HanziHero-debug-${SHORT}.apk"
          TAG="debug-${SHORT}"
          gh release create "$TAG" "HanziHero-debug-${SHORT}.apk" \
            --repo Persie0/hanzi_hero \
            --target "$SHA" \
            --title "HanziHero debug ${SHORT}" \
            --notes "Debug APK including invisible Google Drive startup sync." \
            --prerelease
