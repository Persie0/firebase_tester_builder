name: Cleanup obsolete Actions history

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup_obsolete_actions.yml'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verify workflow inventory before cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            app_store_auto.yml \
            cleanup_obsolete_actions.yml \
            debug_build_release_reusable.yml \
            debug_create_app.yml \
            play_auto.yml | sort)"
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows?ref=${GITHUB_REF_NAME}" --jq '.[].name' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected workflow inventory; refusing cleanup."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi

      - name: Build obsolete run list
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .status, .path] | @tsv' > /tmp/all-runs.tsv

          awk -F '\t' -v current="$GITHUB_RUN_ID" '
            $1 != current &&
            $3 != ".github/workflows/app_store_auto.yml" &&
            $3 != ".github/workflows/play_auto.yml" &&
            $3 != ".github/workflows/debug_build_release_reusable.yml" &&
            $3 != ".github/workflows/debug_create_app.yml"
          ' /tmp/all-runs.tsv > /tmp/obsolete-runs.tsv

          echo "Obsolete runs to delete: $(wc -l < /tmp/obsolete-runs.tsv)"
          echo "Obsolete workflow paths:"
          cut -f3 /tmp/obsolete-runs.tsv | sort | uniq -c | sort -nr || true

      - name: Delete obsolete workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          while IFS=$'\t' read -r run_id status path; do
            [ -n "${run_id:-}" ] || continue
            case "$path" in
              .github/workflows/app_store_auto.yml|.github/workflows/play_auto.yml|.github/workflows/debug_build_release_reusable.yml|.github/workflows/debug_create_app.yml)
                echo "::error::Refusing to delete allowlisted workflow run $run_id ($path)"
                exit 1
                ;;
            esac
            gh api --silent --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            deleted=$((deleted + 1))
            if (( deleted % 100 == 0 )); then
              echo "Deleted $deleted obsolete runs..."
            fi
          done < /tmp/obsolete-runs.tsv
          echo "Deleted $deleted obsolete workflow runs."

      - name: Verify only retained histories plus this run remain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .path] | @tsv' > /tmp/remaining-runs.tsv

          unexpected="$(awk -F '\t' -v current="$GITHUB_RUN_ID" '
            $1 != current &&
            $2 != ".github/workflows/app_store_auto.yml" &&
            $2 != ".github/workflows/play_auto.yml" &&
            $2 != ".github/workflows/debug_build_release_reusable.yml" &&
            $2 != ".github/workflows/debug_create_app.yml"
          ' /tmp/remaining-runs.tsv)"

          if [ -n "$unexpected" ]; then
            echo "::error::Obsolete workflow runs still remain:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          echo "Historical runs now belong only to the four retained workflows plus this maintenance run."

      - name: Remove maintenance workflow file
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/cleanup_obsolete_actions.yml'
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='ci: remove temporary Actions cleanup workflow [skip ci]' \
            -f sha="$sha" \
            -f branch="$GITHUB_REF_NAME" >/dev/null

      - name: Remove this maintenance run from Actions history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --silent --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
