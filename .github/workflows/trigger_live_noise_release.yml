name: Trigger live_noise_cancelling release

on:
  push:
    branches:
      - agent/trigger-live-noise-release-20260902

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing release builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run play_auto.yml \
            --repo Persie0/firebase_tester_builder \
            --ref main \
            -f app=live_noise_cancelling \
            -f build_apk=true \
            -f run_tests=false \
            -f branch=agent/post-merge-audit-20260831
