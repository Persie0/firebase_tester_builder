name: Appodeal 4.3 migrate all apps v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appodeal_43_migrate_all_v2.yml'

jobs:
  migrate:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {repo: Persie0/recorder_noise_remove, branch: chore/appodeal-4-3-no-ironsource}
          - {repo: Persie0/noise_remover, branch: chore/appodeal-4-3-no-ironsource}
          - {repo: Persie0/image_enhancer, branch: fix/ios-att-appodeal-gate}
          - {repo: Persie0/Memory_Palace_Builder, branch: fix/ios-att-appodeal-gate}
          - {repo: Persie0/resistor_scanner, branch: fix/ios-att-appodeal-gate}
          - {repo: Persie0/root_detection_app, branch: fix/ios-att-appodeal-gate}
          - {repo: Persie0/live_noise_cancelling, branch: fix/ios-att-appodeal-gate}
          - {repo: Persie0/resistor-calc, branch: fix/ios-att-appodeal-gate}
          - {repo: Persie0/face_scanner, branch: fix/ios-att-appodeal-gate}
          - {repo: Persie0/fake_gps_detector, branch: fix/ios-att-appodeal-gate}
          - {repo: Persie0/surebets_calculator, branch: fix/ios-att-appodeal-gate}
    runs-on: macos-latest
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clone target branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET_REPO: ${{ matrix.repo }}
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          git clone --branch "$TARGET_BRANCH" --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" target
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply Appodeal 4.3 migration
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Persie0/firebase_tester_builder/main/scripts/appodeal43_migrate.py -o /tmp/appodeal43_migrate.py
          cd target
          python3 /tmp/appodeal43_migrate.py
          flutter pub get
          git diff --check

      - name: Resolve iOS pods
        id: pods
        continue-on-error: true
        run: |
          set -euo pipefail
          cd target
          if [ -f ios/Podfile ]; then
            cd ios
            pod install --repo-update
          fi

      - name: Verify migration invariants
        run: |
          set -euo pipefail
          cd target
          python3 <<'PY'
          from pathlib import Path
          import re
          pub = Path('pubspec.yaml').read_text()
          assert re.search(r'(?m)^\s*stack_appodeal_flutter:\s*\^?4\.3\.0\s*$', pub)
          for p in Path('android/app').glob('build.gradle*'):
              s = p.read_text(); low = s.lower()
              assert 'com.appodeal.ads.sdk:core:4.3.0' in s
              assert 'ironsource' not in low and 'level_play' not in low and 'levelplay' not in low
              assert 'com.unity3d.ads-mediation:' not in low
              vals = [int(v) for v in re.findall(r'minSdk(?:Version)?\s*(?:=\s*)?(\d+)', s)]
              assert not vals or min(vals) >= 24
          pod = Path('ios/Podfile')
          if pod.exists():
              s = pod.read_text(); low = s.lower()
              m = re.search(r"platform\s+:ios\s*,\s*['\"]([0-9.]+)['\"]", s)
              assert m and float(m.group(1)) >= 15.0
              assert 'ironsource' not in low and 'levelplay' not in low and 'level play' not in low
          for p in Path('ios').rglob('project.pbxproj'):
              vals = [float(v) for v in re.findall(r'IPHONEOS_DEPLOYMENT_TARGET = ([0-9.]+);', p.read_text())]
              assert not vals or min(vals) >= 15.0
          init_count = np_count = 0
          for p in Path('lib').rglob('*.dart'):
              s = p.read_text()
              init_count += s.count('Appodeal.initialize(')
              np_count += s.count('Appodeal.setNonPersonalized(true)')
          assert init_count == 0 or np_count >= init_count
          for p in Path('.github/workflows').glob('oneoff-*'):
              raise AssertionError(f'temporary workflow remains: {p}')
          PY

      - name: Commit and push migration
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET_REPO: ${{ matrix.repo }}
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          cd target
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade Appodeal to 4.3.0 and remove IronSource"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" "HEAD:$TARGET_BRANCH"
          fi

      - name: Android debug build
        run: |
          set -euo pipefail
          cd target
          flutter build apk --debug

      - name: Note iOS pod resolution status
        if: always()
        run: |
          echo "pod install outcome: ${{ steps.pods.outcome }}"
