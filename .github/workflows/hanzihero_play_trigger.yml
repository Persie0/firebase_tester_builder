name: HanziHero Play release trigger

on:
  push:
    paths:
      - .github/workflows/hanzihero_play_trigger.yml

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded debug APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST             repos/Persie0/firebase_tester_builder/actions/runs/35547613405/cancel             || true

      - name: Dispatch existing Play Store automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run play_auto.yml             --repo Persie0/firebase_tester_builder             --ref main             -f app=hanzi_hero             -f build_apk=true             -f run_tests=true             -f branch=main
