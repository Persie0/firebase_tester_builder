name: Dispatch Memory Palace Build Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch_memory_palace_once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing Play automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/play_auto.yml/dispatches \
            -d '{"ref":"main","inputs":{"app":"Memory_Palace_Builder","build_apk":"true","run_tests":"true","branch":"main"}}'
